# HiveBreach — Compliance Framework Mapping
# Maps security testing findings to SOC2, PCI-DSS, ISO 27001, and NIST 800-53 controls.
# Used by the report-agent and risk-agent to tag findings with compliance impact.

framework_map:
  version: 1.0.0
  last_updated: 2026-07-08

  # ===================================================================
  # SOC 2 — Trust Services Criteria (TSC)
  # ===================================================================
  soc2:
    display_name: "SOC 2 — Trust Services Criteria"
    description: "Controls relevant to security, availability, processing integrity, confidentiality, and privacy."
    controls:
      # Security — Common Criteria (CC)
      CC6.1:
        description: "Logical and physical access controls — prevent unauthorized access"
        finding_types:
          - sql-injection
          - broken-authentication
          - insecure-direct-object-reference
          - missing-authentication
          - weak-password-policy
          - hardcoded-credentials
          - exposed-admin-interface
      CC6.2:
        description: "User registration and de-registration controls"
        finding_types:
          - guest-user-overexposure
          - orphaned-accounts
          - self-registration-abuse
          - weak-account-provisioning
      CC6.3:
        description: "Authentication mechanism security"
        finding_types:
          - missing-mfa
          - weak-authentication
          - password-spraying-vector
          - default-credentials
          - credential-stuffing-vector
      CC6.6:
        description: "Security of data during transmission"
        finding_types:
          - missing-tls
          - weak-tls-configuration
          - expired-ssl-certificate
          - mixed-content
          - cleartext-protocols
      CC6.7:
        description: "Security of data at rest"
        finding_types:
          - unencrypted-sensitive-data
          - insecure-storage
          - database-exposed
          - s3-bucket-public
          - unencrypted-sqlite
      CC7.1:
        description: "Detection and monitoring of security events"
        finding_types:
          - logging-disabled
          - missing-audit-trail
          - insufficient-logging
          - siem-coverage-gap
      CC7.2:
        description: "Incident response and remediation"
        finding_types:
          - missing-ir-plan
          - unpatched-critical-vulnerability
          - delayed-patching
          - no-incident-response-process
      CC7.3:
        description: "System change management"
        finding_types:
          - unauthorized-configuration-change
          - drift-from-baseline
          - missing-change-control

      # Availability (A)
      A1.1:
        description: "Availability monitoring and capacity planning"
        finding_types:
          - dos-vulnerability
          - resource-exhaustion
          - single-point-of-failure
          - no-redundancy
      A1.2:
        description: "Environmental protections and disaster recovery"
        finding_types:
          - missing-backups
          - untested-dr-plan
          - no-failover-configuration

      # Confidentiality (C)
      C1.1:
        description: "Confidentiality of information in storage and transmission"
        finding_types:
          - data-exposure
          - pii-leakage
          - information-disclosure
          - verbose-error-messages
          - directory-listing
          - backup-exposure

      # Processing Integrity (PI)
      PI1.1:
        description: "Complete and accurate system processing"
        finding_types:
          - mass-assignment
          - business-logic-flaw
          - input-validation-bypass
          - race-condition

  # ===================================================================
  # PCI DSS v4.0 — Payment Card Industry Data Security Standard
  # ===================================================================
  pci_dss:
    display_name: "PCI DSS v4.0"
    description: "Requirements for organizations handling cardholder data."
    requirements:
      # Requirement 1: Install and maintain network security controls
      req_1_2:
        description: "Network access control rules — deny all by default"
        finding_types:
          - overly-permissive-firewall
          - exposed-database
          - unrestricted-ingress
          - open-management-ports
      req_1_3:
        description: "Access to cardholder data restricted to authorized personnel"
        finding_types:
          - public-s3-bucket
          - exposed-pii
          - no-network-segmentation

      # Requirement 2: Apply secure configurations
      req_2_2:
        description: "Configuration standards for all system components"
        finding_types:
          - default-credentials
          - unnecessary-services
          - insecure-configuration
          - default-configuration
      req_2_2_2:
        description: "Disable unnecessary and insecure services/protocols"
        finding_types:
          - legacy-protocols-enabled
          - ssl-3-support
          - tls-1-0-support
          - insecure-ciphers
          - cleartext-protocols

      # Requirement 3: Protect stored cardholder data
      req_3_4:
        description: "Render PAN unreadable anywhere stored"
        finding_types:
          - unencrypted-sensitive-data
          - plaintext-pan-storage
          - weak-encryption
          - hardcoded-encryption-keys
      req_3_5:
        description: "Key management for encrypted cardholder data"
        finding_types:
          - exposed-cryptographic-keys
          - weak-key-generation
          - key-rotation-not-enforced

      # Requirement 4: Encrypt transmission of cardholder data
      req_4_2:
        description: "Never send unprotected PAN by end-user messaging"
        finding_types:
          - data-exfiltration-vector
          - unencrypted-email
          - insecure-file-transfer

      # Requirement 6: Develop and maintain secure systems
      req_6_2:
        description: "Ensure all system components are protected from known vulnerabilities"
        finding_types:
          - unpatched-vulnerability
          - outdated-software
          - known-exploited-vulnerability
          - missing-security-patches
      req_6_4:
        description: "Public-facing web applications protected against attacks"
        finding_types:
          - sql-injection
          - xss-cross-site-scripting
          - csrf-cross-site-request-forgery
          - ssti-server-side-template-injection
          - rce-remote-code-execution
          - lfi-local-file-inclusion
          - command-injection

      # Requirement 7: Restrict access by need-to-know
      req_7_2:
        description: "Access control system covers all system components"
        finding_types:
          - overly-permissive-iam
          - privilege-escalation-path
          - excessive-role-permissions

      # Requirement 8: Identify and authenticate access
      req_8_2:
        description: "Strong authentication for users"
        finding_types:
          - weak-password-policy
          - missing-mfa
          - credential-stuffing-vector
          - password-spraying-vector
          - shared-accounts
      req_8_3:
        description: "Multi-factor authentication for remote access"
        finding_types:
          - no-mfa-remote-access
          - vpn-without-mfa

      # Requirement 10: Log and monitor access
      req_10_2:
        description: "Automated audit trails for all system components"
        finding_types:
          - logging-disabled
          - insufficient-audit-trail
          - missing-centralized-logging
      req_10_4:
        description: "Protect audit trail from destruction and unauthorized modification"
        finding_types:
          - audit-log-tampering
          - log-retention-insufficient

      # Requirement 11: Test security regularly
      req_11_3:
        description: "Internal and external vulnerability scans"
        finding_types:
          - missing-vulnerability-scanning
          - scan-coverage-gap
          - critical-unresolved-findings

  # ===================================================================
  # ISO/IEC 27001:2022 — Annex A Controls
  # ===================================================================
  iso_27001:
    display_name: "ISO/IEC 27001:2022"
    description: "Information security management system standard."
    controls:
      # A.5 — Organizational controls
      A_5_1:
        description: "Policies for information security"
        finding_types:
          - missing-security-policy
          - policy-not-enforced
          - insufficient-security-awareness
      A_5_15:
        description: "Access control for information"
        finding_types:
          - missing-access-control
          - broken-access-control
          - insecure-direct-object-reference

      # A.6 — People controls
      A_6_3:
        description: "Information security awareness, education and training"
        finding_types:
          - phishing-vulnerable
          - lack-of-security-training

      # A.7 — Physical controls
      A_7_9:
        description: "Clear desk and clear screen policy"
        finding_types:
          - exposed-sensitive-information
          - unattended-sessions

      # A.8 — Technological controls
      A_8_1:
        description: "User endpoint devices"
        finding_types:
          - unmanaged-device-access
          - missing-edr-coverage
          - end-of-life-os
      A_8_2:
        description: "Privileged access rights"
        finding_types:
          - excessive-privileges
          - privilege-escalation-path
          - overly-permissive-iam
          - permanent-admin-assignments
          - no-privileged-access-management
      A_8_3:
        description: "Information access restriction"
        finding_types:
          - public-s3-bucket
          - exposed-database
          - world-readable-storage
          - unauthorized-data-access
      A_8_5:
        description: "Secure authentication"
        finding_types:
          - weak-authentication
          - default-credentials
          - missing-mfa
          - credential-stuffing-vector
      A_8_7:
        description: "Protection against malware"
        finding_types:
          - malware-infection
          - missing-antimalware
          - malicious-upload-vector
      A_8_8:
        description: "Management of technical vulnerabilities"
        finding_types:
          - unpatched-vulnerability
          - known-exploited-vulnerability
          - outdated-software
          - missing-vulnerability-scanning
      A_8_9:
        description: "Configuration management"
        finding_types:
          - insecure-configuration
          - config-drift
          - misconfigured-tls
          - unnecessary-services
      A_8_10:
        description: "Information deletion"
        finding_types:
          - data-retention-exceeded
          - insufficient-data-disposal
      A_8_11:
        description: "Data masking"
        finding_types:
          - pii-exposure
          - sensitive-data-in-logs
          - verbose-error-messages
      A_8_12:
        description: "Data leakage prevention"
        finding_types:
          - data-exfiltration-vector
          - unrestricted-egress
          - dns-tunneling-possible
      A_8_16:
        description: "Monitoring activities"
        finding_types:
          - logging-disabled
          - insufficient-monitoring
          - missing-siem-coverage
      A_8_17:
        description: "Clock synchronisation"
        finding_types:
          - unsynchronized-logs
          - ntp-misconfiguration
      A_8_20:
        description: "Networks security"
        finding_types:
          - open-management-ports
          - overly-permissive-firewall
          - unrestricted-ingress
          - missing-network-segmentation
      A_8_21:
        description: "Segregation in networks"
        finding_types:
          - flat-network
          - missing-vlan-segmentation
          - east-west-traffic-unrestricted
      A_8_23:
        description: "Web filtering"
        finding_types:
          - malicious-domain-access
          - no-web-filtering
      A_8_24:
        description: "Use of cryptography"
        finding_types:
          - weak-encryption
          - missing-encryption-at-rest
          - missing-tls
          - weak-tls-configuration
          - custom-cryptography
      A_8_25:
        description: "Secure development lifecycle"
        finding_types:
          - insecure-code-pattern
          - hardcoded-secrets
          - missing-input-validation
          - sql-injection
          - xss

      # A.5.7 — Threat intelligence
      A_5_7:
        description: "Threat intelligence and information sharing"
        finding_types:
          - unknown-threat-landscape
          - no-threat-intel-feed
          - emerging-cve-not-tracked

      # A.5.24 — Incident response
      A_5_24:
        description: "Information security incident management planning and preparation"
        finding_types:
          - missing-ir-plan
          - no-incident-response-process
          - untested-ir-plan
      A_5_25:
        description: "Assessment and decision on information security events"
        finding_types:
          - untriaged-alerts
          - alert-fatigue
          - missing-alert-triage-process
      A_5_26:
        description: "Response to information security incidents"
        finding_types:
          - delayed-incident-response
          - missing-containment-procedure

  # ===================================================================
  # NIST SP 800-53 Rev. 5 — Security and Privacy Controls
  # ===================================================================
  nist_800_53:
    display_name: "NIST SP 800-53 Rev. 5"
    description: "Security and privacy controls for federal information systems."
    controls:
      # Access Control (AC)
      AC-2:
        description: "Account management"
        finding_types:
          - orphaned-accounts
          - shared-accounts
          - guest-user-overexposure
          - excessive-account-privileges
      AC-3:
        description: "Access enforcement"
        finding_types:
          - broken-access-control
          - insecure-direct-object-reference
          - privilege-escalation-path
          - missing-authorization
      AC-4:
        description: "Information flow enforcement"
        finding_types:
          - unrestricted-egress
          - data-exfiltration-vector
          - missing-network-segmentation
      AC-5:
        description: "Separation of duties"
        finding_types:
          - conflicting-roles
          - excessive-privileges
          - no-separation-of-duties
      AC-6:
        description: "Least privilege"
        finding_types:
          - overly-permissive-iam
          - excessive-privileges
          - permanent-admin-assignments
          - no-privileged-access-management
      AC-7:
        description: "Unsuccessful logon attempts"
        finding_types:
          - no-account-lockout
          - weak-account-lockout
          - credential-stuffing-vector
      AC-8:
        description: "System use notification"
        finding_types:
          - missing-banner
          - no-login-warning
      AC-17:
        description: "Remote access"
        finding_types:
          - exposed-rdp
          - no-mfa-remote-access
          - vpn-without-mfa
          - insecure-remote-access

      # Audit and Accountability (AU)
      AU-2:
        description: "Audit events"
        finding_types:
          - logging-disabled
          - insufficient-audit-events
          - missing-security-event-logging
      AU-3:
        description: "Content of audit records"
        finding_types:
          - insufficient-log-detail
          - missing-correlation-id
      AU-4:
        description: "Audit log storage capacity"
        finding_types:
          - log-retention-insufficient
          - log-storage-exhausted
      AU-6:
        description: "Audit review, analysis, and reporting"
        finding_types:
          - missing-siem-coverage
          - untriaged-alerts
          - no-log-review-process
      AU-8:
        description: "Time stamps"
        finding_types:
          - unsynchronized-logs
          - ntp-misconfiguration
      AU-9:
        description: "Protection of audit information"
        finding_types:
          - audit-log-tampering
          - log-without-integrity

      # Configuration Management (CM)
      CM-2:
        description: "Baseline configuration"
        finding_types:
          - config-drift
          - insecure-configuration
          - no-configuration-baseline
      CM-6:
        description: "Configuration settings"
        finding_types:
          - insecure-default-configuration
          - unnecessary-services
          - insecure-protocols
      CM-7:
        description: "Least functionality"
        finding_types:
          - unnecessary-services
          - open-management-ports
          - excessive-software-installed
      CM-8:
        description: "System component inventory"
        finding_types:
          - unknown-assets
          - shadow-it-discovery
          - unmanaged-devices

      # Contingency Planning (CP)
      CP-2:
        description: "Contingency plan"
        finding_types:
          - untested-dr-plan
          - missing-backups
          - no-failover-configuration
      CP-7:
        description: "Alternate processing site"
        finding_types:
          - single-point-of-failure
          - no-disaster-recovery

      # Identification and Authentication (IA)
      IA-2:
        description: "Identification and authentication (organizational users)"
        finding_types:
          - weak-authentication
          - default-credentials
          - missing-mfa
      IA-3:
        description: "Device identification and authentication"
        finding_types:
          - unauthenticated-device-access
          - missing-certificate-authentication
      IA-5:
        description: "Authenticator management"
        finding_types:
          - weak-password-policy
          - hardcoded-credentials
          - credential-reuse
          - password-not-rotated

      # Incident Response (IR)
      IR-4:
        description: "Incident handling"
        finding_types:
          - missing-ir-plan
          - delayed-incident-response
          - no-incident-response-process
      IR-5:
        description: "Incident monitoring"
        finding_types:
          - untriaged-alerts
          - missing-siem-coverage
          - alert-fatigue
      IR-6:
        description: "Incident reporting"
        finding_types:
          - no-incident-reporting-process
          - missing-communication-plan
      IR-7:
        description: "Incident response assistance"
        finding_types:
          - no-ir-playbooks
          - insufficient-ir-training

      # Risk Assessment (RA)
      RA-3:
        description: "Risk assessment"
        finding_types:
          - missing-risk-assessment
          - unassessed-vulnerability
      RA-5:
        description: "Vulnerability monitoring and scanning"
        finding_types:
          - missing-vulnerability-scanning
          - scan-coverage-gap
          - critical-unresolved-findings

      # System and Communications Protection (SC)
      SC-7:
        description: "Boundary protection"
        finding_types:
          - unrestricted-ingress
          - unrestricted-egress
          - missing-firewall-rules
          - exposed-admin-interface
      SC-8:
        description: "Transmission confidentiality and integrity"
        finding_types:
          - missing-tls
          - weak-tls-configuration
          - cleartext-protocols
      SC-12:
        description: "Cryptographic key establishment and management"
        finding_types:
          - exposed-cryptographic-keys
          - weak-key-generation
          - key-rotation-not-enforced
          - custom-cryptography
      SC-13:
        description: "Cryptographic protection"
        finding_types:
          - weak-encryption
          - missing-encryption-at-rest
          - md5-or-sha1-usage

      # System and Information Integrity (SI)
      SI-2:
        description: "Flaw remediation"
        finding_types:
          - unpatched-vulnerability
          - known-exploited-vulnerability
          - delayed-patching
      SI-3:
        description: "Malicious code protection"
        finding_types:
          - missing-antimalware
          - outdated-malware-signatures
          - malware-infection
      SI-4:
        description: "System monitoring"
        finding_types:
          - insufficient-monitoring
          - missing-siem-coverage
          - no-endpoint-detection
      SI-7:
        description: "Software, firmware, and information integrity"
        finding_types:
          - unsigned-code-execution
          - tampered-binaries
          - integrity-check-missing
      SI-10:
        description: "Information input validation"
        finding_types:
          - sql-injection
          - xss
          - command-injection
          - ssti
          - lfi
          - rfi
          - insecure-deserialization

  # ===================================================================
  # Finding type → framework mapping summary (reverse lookup)
  # ===================================================================
  finding_type_mapping:
    sql-injection:
      soc2: [CC6.1]
      pci_dss: [req_6_4]
      iso_27001: [A_8_25]
      nist_800_53: [SI-10]

    xss-cross-site-scripting:
      soc2: [CC6.6]
      pci_dss: [req_6_4]
      iso_27001: [A_8_25]
      nist_800_53: [SI-10]

    broken-access-control:
      soc2: [CC6.1]
      iso_27001: [A_5_15, A_8_3]
      nist_800_53: [AC-3]

    insecure-direct-object-reference:
      soc2: [CC6.1]
      iso_27001: [A_5_15]
      nist_800_53: [AC-3]

    missing-mfa:
      soc2: [CC6.3]
      pci_dss: [req_8_3]
      iso_27001: [A_8_5]
      nist_800_53: [IA-2]

    weak-password-policy:
      soc2: [CC6.1]
      pci_dss: [req_8_2]
      nist_800_53: [IA-5]

    default-credentials:
      soc2: [CC6.3]
      pci_dss: [req_2_2]
      iso_27001: [A_8_5]
      nist_800_53: [IA-2, IA-5]

    unpatched-vulnerability:
      pci_dss: [req_6_2]
      iso_27001: [A_8_8]
      nist_800_53: [SI-2]

    known-exploited-vulnerability:
      pci_dss: [req_6_2]
      iso_27001: [A_8_8]
      nist_800_53: [SI-2]

    overly-permissive-iam:
      soc2: [CC6.1]
      pci_dss: [req_7_2]
      iso_27001: [A_8_2]
      nist_800_53: [AC-6]

    privilege-escalation-path:
      soc2: [CC6.1]
      pci_dss: [req_7_2]
      iso_27001: [A_8_2]
      nist_800_53: [AC-3]

    public-s3-bucket:
      soc2: [C1.1]
      pci_dss: [req_1_3]
      iso_27001: [A_8_3]

    unencrypted-sensitive-data:
      soc2: [CC6.7]
      pci_dss: [req_3_4]
      iso_27001: [A_8_24]
      nist_800_53: [SC-13]

    missing-tls:
      soc2: [CC6.6]
      pci_dss: [req_4_2]
      iso_27001: [A_8_24]
      nist_800_53: [SC-8]

    logging-disabled:
      soc2: [CC7.1]
      pci_dss: [req_10_2]
      iso_27001: [A_8_16]
      nist_800_53: [AU-2, AU-3]

    missing-ir-plan:
      soc2: [CC7.2]
      iso_27001: [A_5_24]
      nist_800_53: [IR-4]

    data-exfiltration-vector:
      soc2: [C1.1]
      iso_27001: [A_8_12]
      nist_800_53: [AC-4]

    missing-vulnerability-scanning:
      pci_dss: [req_11_3]
      iso_27001: [A_8_8]
      nist_800_53: [RA-5]
