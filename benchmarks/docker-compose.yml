services:
  dvwa:
    image: vulnerables/web-dvwa
    container_name: bench-dvwa
    ports:
      - "${DVWA_PORT:-8080}:80"
    environment:
      - DVWA_WEB_ROOT=/var/www/html
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    container_name: bench-juice-shop
    ports:
      - "${JUICE_PORT:-3000}:3000"
    restart: unless-stopped

  webgoat:
    image: webgoat/goatandwolf:latest
    container_name: bench-webgoat
    ports:
      - "${WEBGOAT_PORT:-8081}:8080"
      - "${WEBWOLF_PORT:-9090}:9090"
    restart: unless-stopped

  vampi:
    image: erev0s/vampi
    container_name: bench-vampi
    ports:
      - "${VAMPI_PORT:-5000}:5000"
    restart: unless-stopped

  metasploitable:
    image: tleemcjr/metasploitable2
    container_name: bench-metasploitable
    ports:
      - "${MSF_SSH_PORT:-2222}:22"
      - "${MSF_HTTP_PORT:-8082}:80"
      - "${MSF_FTP_PORT:-2121}:21"
    restart: unless-stopped

networks:
  default:
    name: hivebreach-bench
